services:
  postgres:
    image: postgres:17.6
    environment:
      POSTGRES_DB: orders_demo
      POSTGRES_USER: demo_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run setup in README to create .env}
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["orders-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo_admin -d orders_demo"]
      interval: 2s
      timeout: 2s
      retries: 30
volumes:
  orders-data:
